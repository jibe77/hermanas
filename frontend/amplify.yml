version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 16
        - nvm use 16
        - node -v
        - npm install
    build:
      commands:
        - mkdir -p dist/hermanas-client
        - npm run build
  artifacts:
    baseDirectory: dist/hermanas-client
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
