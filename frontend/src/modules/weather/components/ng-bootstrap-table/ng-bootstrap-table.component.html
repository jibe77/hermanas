<form>
    <div class="form-group form-inline">
        Full text search:<input
            class="form-control ml-2"
            type="text"
            name="searchTerm"
            [(ngModel)]="countryService.searchTerm"
        />
        @if (countryService.loading$ | async) {
            <span class="ml-3">Loading...</span>
        }
    </div>
    <table class="table table-striped">
        <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col" sbSortable="name" (sort)="onSort($event)">
                    <span>Country</span>
                    @if (sortedColumn === 'name') {
                        <sb-sort-icon [direction]="sortedDirection"></sb-sort-icon>
                    }
                </th>
                <th scope="col" sbSortable="area" (sort)="onSort($event)">
                    <span>Area</span>
                    @if (sortedColumn === 'area') {
                        <sb-sort-icon [direction]="sortedDirection"></sb-sort-icon>
                    }
                </th>
                <th scope="col" sbSortable="population" (sort)="onSort($event)">
                    <span>Population</span>
                    @if (sortedColumn === 'population') {
                        <sb-sort-icon [direction]="sortedDirection"></sb-sort-icon>
                    }
                </th>
            </tr>
        </thead>
        <tbody>
            @for (country of countries$ | async; track country) {
                <tr>
                    <th scope="row">{{ country.id }}</th>
                    <td>
                        <img
                            class="mr-2"
                            [src]="'https://upload.wikimedia.org/wikipedia/commons/' + country.flag"
                            style="width: 20px"
                        /><ngb-highlight
                            [result]="country.name"
                            [term]="countryService.searchTerm"
                        ></ngb-highlight>
                    </td>
                    <td>
                        <ngb-highlight
                            [result]="country.area | number"
                            [term]="countryService.searchTerm"
                        ></ngb-highlight>
                    </td>
                    <td>
                        <ngb-highlight
                            [result]="country.population | number"
                            [term]="countryService.searchTerm"
                        ></ngb-highlight>
                    </td>
                </tr>
            }
        </tbody>
    </table>
    <div class="d-flex justify-content-between p-2">
        <ngb-pagination
            [collectionSize]="total$ | async"
            [(page)]="countryService.page"
            [pageSize]="countryService.pageSize"
        ></ngb-pagination
        ><select
            class="custom-select"
            style="width: auto"
            name="pageSize"
            [(ngModel)]="countryService.pageSize"
        >
            <option [ngValue]="2">2 items per page</option>
            <option [ngValue]="4">4 items per page</option>
            <option [ngValue]="6">6 items per page</option>
        </select>
    </div>
</form>
