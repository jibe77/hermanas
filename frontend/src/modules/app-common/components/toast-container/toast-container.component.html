<div class="toast-container">
    @for (toast of toasts; track toast) {
        <div [class]="'toast ' + getToastClass(toast.type)" [@toastAnimation]>
            <div class="toast-header">
                <fa-icon [icon]="['fas', getIconClass(toast.type)]" class="toast-icon"></fa-icon>
                <strong class="toast-title">{{ toast.title || toast.type | titlecase }}</strong>
                <button
                    type="button"
                    class="toast-close"
                    (click)="removeToast(toast.id)"
                    aria-label="Close"
                >
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="toast-body">
                {{ toast.message }}
            </div>
        </div>
    }
</div>
