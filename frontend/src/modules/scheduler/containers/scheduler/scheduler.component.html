<sb-layout-dashboard>
    <sb-dashboard-head
        title="Scheduler"
        i18n-title="@@schedulerTitle"
        [hideBreadcrumbs]="true"
    ></sb-dashboard-head>

    <sb-card>
        <div class="card-body">
            <span i18n="@@schedulerInfo"
                >Force fixed opening and closing times for the coop door. When enabled, the fixed
                time fully replaces the sunrise/sunset computation — light and door protocols shift
                accordingly.</span
            >
        </div>
    </sb-card>

    @if (loading) {
        <sb-card>
            <div class="card-body">
                <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                <span i18n="@@loading">Loading...</span>
            </div>
        </sb-card>
    }

    @if (!loading) {
        <sb-card>
            <div class="card-header">
                <fa-icon class="me-1" [icon]="['fas', 'clock']"></fa-icon>
                <span i18n="@@schedulerForceTitle">Forced door schedule</span>
            </div>
            <div class="card-body">
                <div class="row g-4">
                    <div class="col-md-6">
                        <h6 i18n="@@schedulerOpeningBlock">Opening</h6>
                        <div class="form-check form-switch mb-2">
                            <input
                                type="checkbox"
                                class="form-check-input"
                                id="openingForceToggle"
                                [(ngModel)]="force.opening_enabled"
                            />
                            <label
                                class="form-check-label"
                                for="openingForceToggle"
                                i18n="@@schedulerOpeningForceLabel"
                                >Force opening time</label
                            >
                        </div>
                        <label
                            for="openingForceTime"
                            class="form-label small"
                            i18n="@@schedulerOpeningTimeLabel"
                            >Opening time</label
                        >
                        <input
                            id="openingForceTime"
                            type="time"
                            class="form-control form-control-sm"
                            [(ngModel)]="force.opening_time"
                            [disabled]="!force.opening_enabled"
                        />
                    </div>
                    <div class="col-md-6">
                        <h6 i18n="@@schedulerClosingBlock">Closing</h6>
                        <div class="form-check form-switch mb-2">
                            <input
                                type="checkbox"
                                class="form-check-input"
                                id="closingForceToggle"
                                [(ngModel)]="force.closing_enabled"
                            />
                            <label
                                class="form-check-label"
                                for="closingForceToggle"
                                i18n="@@schedulerClosingForceLabel"
                                >Force closing time</label
                            >
                        </div>
                        <label
                            for="closingForceTime"
                            class="form-label small"
                            i18n="@@schedulerClosingTimeLabel"
                            >Closing time</label
                        >
                        <input
                            id="closingForceTime"
                            type="time"
                            class="form-control form-control-sm"
                            [(ngModel)]="force.closing_time"
                            [disabled]="!force.closing_enabled"
                        />
                    </div>
                </div>
                <div class="mt-3 text-end">
                    <button
                        type="button"
                        class="btn btn-primary btn-sm"
                        (click)="save()"
                        [disabled]="saving"
                    >
                        @if (saving) {
                            <span
                                class="spinner-border spinner-border-sm me-2"
                                role="status"
                            ></span>
                        }
                        <fa-icon class="me-1" [icon]="['fas', 'check']"></fa-icon>
                        <span i18n="@@save">Save</span>
                    </button>
                </div>
            </div>
        </sb-card>
    }
</sb-layout-dashboard>
