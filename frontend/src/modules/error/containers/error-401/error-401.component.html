<sb-layout-error
    ><div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="text-center mt-4">
                    <h1 class="display-1">401</h1>
                    <p class="lead" i18n="@@error401Title">Unauthorized</p>
                    <p i18n="@@error401Body">Access to this resource is denied.</p>
                    <a routerLink="/dashboard">
                        <fa-icon class="mr-1" [icon]="['fas', 'arrow-left']"></fa-icon>
                        <span i18n="@@errorBackToDashboard">Return to Dashboard</span>
                    </a>
                </div>
            </div>
        </div>
    </div></sb-layout-error
>
