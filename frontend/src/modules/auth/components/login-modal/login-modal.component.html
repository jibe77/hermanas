@if (open()) {
    <div class="sb-login-modal-backdrop" (click)="close()"></div>
    <div
        class="sb-login-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="sbLoginModalTitle"
    >
        <div class="card login-modal-card" (click)="$event.stopPropagation()">
            <div class="card-body">
                <button
                    type="button"
                    class="btn-close float-end"
                    (click)="close()"
                    [disabled]="submitting"
                    aria-label="Close"
                ></button>
                <h4 class="card-title text-center mb-3" id="sbLoginModalTitle" i18n="@@signin">
                    Connexion
                </h4>
                <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
                    <div class="form-group mb-3">
                        <label for="sb-login-modal-username" i18n="@@username">Identifiant</label>
                        <input
                            class="form-control"
                            id="sb-login-modal-username"
                            type="text"
                            formControlName="username"
                            autocomplete="username"
                            data-cy="loginUsername"
                            required
                        />
                    </div>
                    <div class="form-group mb-3">
                        <label for="sb-login-modal-password" i18n="@@password">Mot de passe</label>
                        <input
                            class="form-control"
                            id="sb-login-modal-password"
                            type="password"
                            formControlName="password"
                            autocomplete="current-password"
                            data-cy="loginPassword"
                            required
                        />
                    </div>
                    <div class="form-check mb-3">
                        <input
                            class="form-check-input"
                            id="sb-login-modal-rememberme"
                            type="checkbox"
                            formControlName="rememberMe"
                            data-cy="loginRememberMe"
                        />
                        <label
                            class="form-check-label"
                            for="sb-login-modal-rememberme"
                            i18n="@@rememberMe"
                            >Se souvenir de moi</label
                        >
                    </div>
                    @if (errorMessage) {
                        <div class="alert alert-danger" data-cy="loginError">
                            {{ errorMessage }}
                        </div>
                    }
                    <button
                        class="btn btn-primary w-100"
                        type="submit"
                        data-cy="loginSubmit"
                        [disabled]="loginForm.invalid || submitting"
                    >
                        @if (!submitting) {
                            <span i18n="@@signin">Se connecter</span>
                        }
                        @if (submitting) {
                            <span i18n="@@signinInProgress">Connexion…</span>
                        }
                    </button>
                    <div class="mt-3 text-center">
                        <a
                            href="javascript:void(0)"
                            (click)="goToRegister()"
                            i18n="@@loginCreateAccount"
                            >Pas de compte ? S'inscrire</a
                        >
                    </div>
                </form>
            </div>
        </div>
    </div>
}
