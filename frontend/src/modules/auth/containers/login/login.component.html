<sb-layout-auth
    ><div class="container">
        <div class="card login-card">
            <div class="card-body">
                <h4 class="card-title text-center" i18n="@@signin">Connexion</h4>
                <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
                    <div class="form-group mb-3"><label for="username" i18n="@@username">Identifiant</label><input class="form-control" id="username" type="text" formControlName="username" autocomplete="username" data-cy="loginUsername" required /></div>
                    <div class="form-group mb-3"><label for="password" i18n="@@password">Mot de passe</label><input class="form-control" id="password" type="password" formControlName="password" autocomplete="current-password" data-cy="loginPassword" required /></div>
                    <div class="alert alert-danger" *ngIf="errorMessage" data-cy="loginError">{{ errorMessage }}</div>
                    <button class="btn btn-primary w-100" type="submit" data-cy="loginSubmit" [disabled]="loginForm.invalid || submitting"><span *ngIf="!submitting" i18n="@@signin">Se connecter</span><span *ngIf="submitting" i18n="@@signinInProgress">Connexion…</span></button>
                </form>
            </div>
        </div>
    </div></sb-layout-auth
>
