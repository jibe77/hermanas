<sb-layout-auth
    ><div class="container">
        <div class="card login-card">
            <div class="card-body">
                <h4 class="card-title text-center" i18n="@@signin">Connexion</h4>
                <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
                    <div class="form-group mb-3">
                        <label for="username" i18n="@@username">Identifiant</label
                        ><input
                            class="form-control"
                            id="username"
                            type="text"
                            formControlName="username"
                            autocomplete="username"
                            data-cy="loginUsername"
                            required
                        />
                    </div>
                    <div class="form-group mb-3">
                        <label for="password" i18n="@@password">Mot de passe</label
                        ><input
                            class="form-control"
                            id="password"
                            type="password"
                            formControlName="password"
                            autocomplete="current-password"
                            data-cy="loginPassword"
                            required
                        />
                    </div>
                    <div class="form-check mb-3">
                        <input
                            class="form-check-input"
                            id="rememberMe"
                            type="checkbox"
                            formControlName="rememberMe"
                            data-cy="loginRememberMe"
                        /><label class="form-check-label" for="rememberMe" i18n="@@rememberMe"
                            >Se souvenir de moi</label
                        >
                    </div>
                    @if (errorMessage) {
                        <div class="alert alert-danger" data-cy="loginError">
                            {{ errorMessage }}
                        </div>
                    }
                    <button
                        class="btn btn-primary w-100"
                        type="submit"
                        data-cy="loginSubmit"
                        [disabled]="loginForm.invalid || submitting"
                    >
                        @if (!submitting) {
                            <span i18n="@@signin">Se connecter</span>
                        }
                        @if (submitting) {
                            <span i18n="@@signinInProgress">Connexion…</span>
                        }
                    </button>
                    <div class="mt-3 text-center">
                        <a routerLink="/auth/register" i18n="@@loginCreateAccount"
                            >Pas de compte ? S'inscrire</a
                        >
                    </div>
                </form>
            </div>
        </div>
    </div></sb-layout-auth
>
