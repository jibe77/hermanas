@if (active()) {
    <div class="easter-field" aria-hidden="true">
        @for (e of eggs; track e) {
            <span
                class="floating-egg"
                [style.left]="e.left"
                [style.animation-delay]="e.delay"
                [style.animation-duration]="e.duration"
                [style.--sway]="e.sway"
            >
                <svg
                    [attr.width]="e.size"
                    [attr.height]="e.size * 1.3"
                    viewBox="0 0 30 40"
                    [style.transform]="'rotate(' + e.rotation + ')'"
                >
                    <ellipse
                        cx="15"
                        cy="22"
                        rx="13"
                        ry="17"
                        [attr.fill]="e.body"
                        stroke="#0003"
                        stroke-width="0.6"
                    />
                    <path
                        d="M 2 18 Q 8 24 14 18 T 28 18"
                        [attr.stroke]="e.pattern"
                        stroke-width="1.6"
                        fill="none"
                        stroke-linecap="round"
                    />
                    <path
                        d="M 2 28 Q 8 34 14 28 T 28 28"
                        [attr.stroke]="e.pattern"
                        stroke-width="1.6"
                        fill="none"
                        stroke-linecap="round"
                    />
                    <circle cx="10" cy="12" r="1.5" [attr.fill]="e.pattern" />
                    <circle cx="20" cy="12" r="1.5" [attr.fill]="e.pattern" />
                </svg>
            </span>
        }
    </div>
}
