@if (active()) {
    <div class="halloween-field" aria-hidden="true">
        @for (p of pumpkins; track p) {
            <span
                class="floating-pumpkin"
                [style.left]="p.left"
                [style.animation-delay]="p.delay"
                [style.animation-duration]="p.duration"
                [style.--sway]="p.sway"
            >
                <svg
                    [attr.width]="p.size"
                    [attr.height]="p.size"
                    viewBox="0 0 40 40"
                    [style.transform]="'rotate(' + p.rotation + ')'"
                >
                    <!-- Pumpkin body: three lobes for the ridged silhouette -->
                    <ellipse
                        cx="20"
                        cy="22"
                        rx="16"
                        ry="14"
                        fill="#f08020"
                        stroke="#7a3010"
                        stroke-width="1"
                    />
                    <ellipse cx="13" cy="22" rx="6" ry="13" fill="#d95e10" opacity="0.6" />
                    <ellipse cx="27" cy="22" rx="6" ry="13" fill="#d95e10" opacity="0.6" />
                    <!-- Stem -->
                    <rect
                        x="18"
                        y="5"
                        width="4"
                        height="6"
                        fill="#3a5020"
                        stroke="#1f2c10"
                        stroke-width="0.8"
                        rx="1"
                    />
                    <!-- Jack-o'-lantern face -->
                    <polygon points="12,20 16,20 14,24" fill="#1a0808" />
                    <polygon points="24,20 28,20 26,24" fill="#1a0808" />
                    <path
                        d="M 11 28 L 14 30 L 17 27 L 20 30 L 23 27 L 26 30 L 29 28 L 28 32 L 12 32 Z"
                        fill="#1a0808"
                    />
                </svg>
            </span>
        }
        @for (b of bats; track b) {
            <span
                class="flying-bat"
                [class.ltr]="b.direction === 'ltr'"
                [class.rtl]="b.direction === 'rtl'"
                [style.top]="b.top"
                [style.animation-delay]="b.delay"
                [style.animation-duration]="b.duration"
            >
                <svg width="32" height="20" viewBox="0 0 40 24">
                    <path
                        d="M 20 6 Q 16 0 8 2 Q 0 4 4 12 Q 8 8 12 12 L 16 10 L 18 14 L 20 12 L 22 14 L 24 10 L 28 12 Q 32 8 36 12 Q 40 4 32 2 Q 24 0 20 6 Z"
                        fill="#1a1020"
                        stroke="#0a0510"
                        stroke-width="0.6"
                    />
                    <circle cx="17" cy="9" r="0.8" fill="#f08020" />
                    <circle cx="23" cy="9" r="0.8" fill="#f08020" />
                </svg>
            </span>
        }
    </div>
    <div class="spider-web" aria-hidden="true">
        <svg width="120" height="120" viewBox="0 0 120 120">
            <g fill="none" stroke="#e8e8f0" stroke-width="1" opacity="0.8">
                <!-- Radial spokes from the top-right corner anchor -->
                <line x1="120" y1="0" x2="0" y2="0" />
                <line x1="120" y1="0" x2="0" y2="40" />
                <line x1="120" y1="0" x2="0" y2="80" />
                <line x1="120" y1="0" x2="0" y2="120" />
                <line x1="120" y1="0" x2="40" y2="120" />
                <line x1="120" y1="0" x2="80" y2="120" />
                <line x1="120" y1="0" x2="120" y2="120" />
                <!-- Concentric arcs -->
                <path d="M 90 0 Q 90 20 70 30 Q 90 30 90 0" />
                <path d="M 70 0 Q 70 35 30 55 Q 70 50 70 0" />
                <path d="M 40 0 Q 40 60 0 90 Q 50 75 40 0" />
            </g>
            <!-- Spider hanging from the corner -->
            <circle cx="50" cy="55" r="4" fill="#1a1020" />
            <circle cx="50" cy="49" r="3" fill="#1a1020" />
            <line x1="120" y1="0" x2="50" y2="50" stroke="#444" stroke-width="0.5" />
            <line x1="46" y1="53" x2="40" y2="50" stroke="#1a1020" stroke-width="0.8" />
            <line x1="46" y1="55" x2="40" y2="58" stroke="#1a1020" stroke-width="0.8" />
            <line x1="46" y1="57" x2="42" y2="62" stroke="#1a1020" stroke-width="0.8" />
            <line x1="54" y1="53" x2="60" y2="50" stroke="#1a1020" stroke-width="0.8" />
            <line x1="54" y1="55" x2="60" y2="58" stroke="#1a1020" stroke-width="0.8" />
            <line x1="54" y1="57" x2="58" y2="62" stroke="#1a1020" stroke-width="0.8" />
        </svg>
    </div>
}
