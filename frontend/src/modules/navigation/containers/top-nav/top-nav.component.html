<nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark" [class.advent]="advent()" [class.easter]="easter()" [class.halloween]="halloween()">
    <!-- Brand: mini SVG hen + name, same visual language as the 404 page so
         the friendly chicken motif appears as soon as the visitor lands. The
         SVG is inline so the comb / beak colours follow the theme without an
         extra asset, and the head wobbles every few seconds to give the bar a
         tiny bit of life without being distracting. -->
    <a class="navbar-brand brand-hen" routerLink="/dashboard" (click)="onBrandClick()" aria-label="Hermanas — home" i18n-aria-label="@@brandHenAriaLabel">
        <svg
            class="brand-hen-svg"
            viewBox="0 0 60 50"
            role="img"
            aria-hidden="true"
        >
            <!-- Body -->
            <ellipse cx="32" cy="34" rx="18" ry="13" fill="#f5d49b" stroke="#6b4226" stroke-width="1.5" />
            <!-- Wing -->
            <path d="M 23 32 Q 19 22 35 25 Q 42 35 26 40 Z" fill="#e0a96d" stroke="#6b4226" stroke-width="1.2" />
            <!-- Tail feathers -->
            <path d="M 49 30 Q 58 26 56 36 Q 53 42 47 36 Z" fill="#c08552" stroke="#6b4226" stroke-width="1.2" />
            <!-- Head (group for wobble animation) -->
            <g class="brand-hen-head">
                <circle cx="22" cy="20" r="9" fill="#f5d49b" stroke="#6b4226" stroke-width="1.5" />
                <!-- Comb -->
                <path d="M 18 12 Q 20 7 22 13 Q 24 8 26 13 Q 28 9 29 14 Z" fill="#d93030" stroke="#6b4226" stroke-width="1" />
                <!-- Beak -->
                <polygon points="13,21 7,22 13,25" fill="#f0a830" stroke="#6b4226" stroke-width="1" />
                <!-- Eye -->
                <circle cx="18" cy="19" r="1.5" fill="#222" />
                <!-- Santa hat — shown only during Advent (see SCSS .advent rule). -->
                <g class="brand-santa-hat">
                    <polygon points="14,11 28,11 34,-2" fill="#d93030" stroke="#7a1818" stroke-width="0.8" />
                    <ellipse cx="14" cy="11" rx="7" ry="2" fill="#ffffff" stroke="#cccccc" stroke-width="0.6" />
                    <ellipse cx="28" cy="11" rx="7" ry="2" fill="#ffffff" stroke="#cccccc" stroke-width="0.6" />
                    <circle cx="34" cy="-2" r="2.2" fill="#ffffff" stroke="#cccccc" stroke-width="0.6" />
                </g>
                <!-- Witch hat — shown only during Halloween. -->
                <g class="brand-witch-hat">
                    <polygon points="14,11 30,11 26,-4" fill="#2a1430" stroke="#0c0410" stroke-width="0.8" />
                    <ellipse cx="22" cy="11" rx="11" ry="1.8" fill="#2a1430" stroke="#0c0410" stroke-width="0.6" />
                    <path d="M 17 8 L 21 8 L 19 11 Z" fill="#d4a020" stroke="#0c0410" stroke-width="0.4" />
                </g>
            </g>
            <!-- Legs -->
            <line x1="28" y1="46" x2="28" y2="50" stroke="#6b4226" stroke-width="1.5" stroke-linecap="round" />
            <line x1="36" y1="46" x2="36" y2="50" stroke="#6b4226" stroke-width="1.5" stroke-linecap="round" />
        </svg>
        <span class="brand-hen-text">Hermanas</span>
    </a>
    <button
        class="btn btn-link btn-sm order-1 order-lg-0"
        id="sidebarToggle"
        data-cy="topNavToggleSideNav"
        (click)="toggleSideNav()"
    >
        <fa-icon [icon]="['fas', 'bars']"></fa-icon></button
    ><!-- Decorative strolling hens fill the empty space between the toggle
         and the right-side nav. Hidden on phones (see chickens-strip.scss). -->
    <sb-chickens-strip></sb-chickens-strip><!-- Navbar-->
    <ul class="nav navbar-nav ms-auto me-3">
        <sb-top-nav-lang></sb-top-nav-lang
        ><sb-top-nav-user></sb-top-nav-user>
    </ul>
</nav>
<sb-confetti></sb-confetti>
<sb-disco-overlay></sb-disco-overlay>
<sb-advent-overlay></sb-advent-overlay>
<sb-easter-overlay></sb-easter-overlay>
<sb-halloween-overlay></sb-halloween-overlay>
