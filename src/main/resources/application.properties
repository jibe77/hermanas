spring.quartz.job-store-type=memory

# Tomcat default MIME table does not know the .webmanifest extension, so the bundled Angular
# PWA manifest is served as application/octet-stream — which makes Safari prompt for download
# instead of treating it as a manifest. Map it explicitly to the standard type.
server.tomcat.mime-mappings.webmanifest=application/manifest+json

# Let Hibernate create missing tables (e.g. new entities added in a release) without
# touching existing data. Safe for the project since schema changes are simple and infrequent.
spring.jpa.hibernate.ddl-auto=update

# Always run schema.sql on startup — used to create non-JPA tables such as the
# Spring Security "persistent_logins" table for remember-me tokens. Idempotent.
spring.sql.init.mode=always
# Run schema.sql AFTER Hibernate has created/updated JPA entities, so there is no race
# between the two on a fresh database.
spring.jpa.defer-datasource-initialization=true

# Actuator: expose only the endpoints we actually use, and disable the dangerous ones
# (env / configprops / heapdump leak secrets and memory contents). /health and /info
# stay public — see SecurityConfig — the rest is reserved to ROLE_ADMIN.
management.endpoints.web.exposure.include=health,info,metrics,loggers,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.heapdump.enabled=false
management.endpoint.threaddump.enabled=false
management.endpoint.env.enabled=false
management.endpoint.configprops.enabled=false
management.endpoint.beans.enabled=false
management.endpoint.shutdown.enabled=false

info.app.name=Hermanas
info.app.description=Chicken coop automation
info.java-vendor = ${java.specification.vendor}

info.app.encoding=@project.build.sourceEncoding@
info.app.java.source=@java.version@
info.app.java.target=@java.version@

# profiles
#     gpio-rpi : default profile, connecting the connected objects to the raspberry pi GPIO
#     fake-rpi : connecting the connected objects to a fake implementation, it's useful to test the application on a PC
spring.profiles.default=gpio-rpi

camera.path.root = ./photos
camera.rotation = 180
camera.scheduler.by.night = false
camera.encoding = JPEG
camera.brightness = 60

camera.high.width = 960
camera.high.height = 540
camera.high.quality = 80
camera.high.delay = 2500

camera.regular.width = 480
camera.regular.height = 270
camera.regular.quality = 70
camera.regular.delay = 750

camera.streaming.command = /usr/local/bin/mjpg_streamer -i '/usr/local/lib/mjpg-streamer/input_raspicam.so -x 480 -y 270 -vf -hf -br 60 -fps 3' -o '/usr/local/lib/mjpg-streamer/output_http.so -p 8081'
camera.picam.jni.implementation = /home/pi/picam-2.0.1.so
spring.mvc.async.request-timeout = 3600000

# take picture every 10800000 ms (3 hours)
camera.scheduler.delay.in.milliseconds = 10800000
diskspace.scheduler.delay.in.milliseconds = 10800000

door.opening.duration = 10000
door.closing.duration = 2350
suntime.sunrise.force_at_8 = false

# position
#  0 -> stop
#  5 -> turning clockwise
#  16 -> turning counter-clockwise
door.opening.position = 16
door.closing.position = 5

# every 60000 ms (1 minute) verifies if there is a task related to the sun time (sunrise or sunset)
suntime.scheduler.delay.in.milliseconds=60000
suntime.scheduler.light.on.time_before_sunset=0
suntime.scheduler.door.close.time_after_sunset=45
suntime.scheduler.door.open.time_after_sunrise=0
# GPS position of the chicken coop (by default, it is located in Paris at the Eiffel tower !)
suntime.latitude = 48.858370
suntime.longitude = 2.294481

door.button.bottom.gpio.address = 15
door.button.up.gpio.address = 18
door.servo.gpio.address = 25
door.servo.gpio.range = 100
birdhouse.button.gpio.address = 24

light.relay.enabled = true
light.relay.gpio.address = 14

# light security timer : 1 / 15 / 30 minutes
light.security.timer.delay.eco = 60000
light.security.timer.delay.regular = 900000
light.security.timer.delay.sunny = 1800000

fan.relay.enabled = true
fan.relay.gpio.address = 23
# fan are playing 1 minutes in winter (eco mode)
# 10 seconds
fan.security.timer.delay.eco = 10000
# 1 minute
fan.security.timer.delay.regular = 60000
# 20 minutes
fan.security.timer.delay.sunny = 1200000

fan.scheduler.delay.in.milliseconds = 3600000

sensor.scheduler.delay.in.milliseconds = 7200000
# it takes a few seconds to returns the temperature and humidity values, timeout set to 10 secondes
sensor.python.command = /usr/bin/python
sensor.python.script = /home/pi/AdafruitDHT.py
sensor.python.arg1 = 22
sensor.python.arg2 = 4
sensor.cache.delay = 30000

# openweather service url with 3 parameters {} replaced with latitude, longitude and key.
weather.info.url = http://api.openweathermap.org/data/2.5/weather?lat={latitude}&lon={longitude}&units=metric&appid={key}
weather.info.key = to-override-in-application-properties-file
weather.info.enabled = false

# Resilience4j circuit breaker for the OpenWeather API.
# Window of the 10 most recent calls; opens when >=50% fail; stays open 5 min, then half-open.
resilience4j.circuitbreaker.instances.weatherApi.register-health-indicator = true
resilience4j.circuitbreaker.instances.weatherApi.sliding-window-type = COUNT_BASED
resilience4j.circuitbreaker.instances.weatherApi.sliding-window-size = 10
resilience4j.circuitbreaker.instances.weatherApi.minimum-number-of-calls = 5
resilience4j.circuitbreaker.instances.weatherApi.failure-rate-threshold = 50
resilience4j.circuitbreaker.instances.weatherApi.wait-duration-in-open-state = 5m
resilience4j.circuitbreaker.instances.weatherApi.permitted-number-of-calls-in-half-open-state = 2
resilience4j.circuitbreaker.instances.weatherApi.automatic-transition-from-open-to-half-open-enabled = true

email.notification.enabled=false
email.notification.to=to-override-in-application-properties-file@gmail.com
email.notification.from=to-override-in-application-properties-file@gmail.com

spring.mail.host=smtp.gmail.com
spring.mail.port=25
spring.mail.username=to-override-in-application-properties-file@gmail.com

# Other properties
spring.mail.properties.mail.debug=true
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=50000
spring.mail.properties.mail.smtp.timeout=50000
spring.mail.properties.mail.smtp.writetimeout=50000

# TLS , port 587
spring.mail.properties.mail.smtp.starttls.enable=true

# SSL, post 465
spring.mail.properties.mail.smtp.socketFactory.port = 465
spring.mail.properties.mail.smtp.socketFactory.class = javax.net.ssl.SSLSocketFactory

music.enabled = true
music.path.mix = /home/pi/music/mix
music.path.rooster = /home/pi/music/rooster
# Default playlist (sub-directory of music.path.mix). Empty = pick all songs across every playlist.
music.playlist.selected =
music.player.start.cmd=/usr/bin/cvlc
music.player.nodisp.param = --no-video
music.player.shuffle.param = -Z

music.volume.cmd = /usr/bin/amixer
music.volume.arg1 = set
music.volume.arg2 = PCM
music.volume.max = 100%
music.volume.regular = 78%
# playing music for 1 / 20 / 60 minutes
music.security.timer.delay.eco = 60000
music.security.timer.delay.regular = 1200000
music.security.timer.delay.sunny = 3600000

play.cocorico.at.sunrise.enabled = true
play.song.at.sunset = true

# Directory containing the application log files. On the Pi this resolves to /home/pi/log
# (spring.log + rotated spring.log.YYYY-MM-DD.N.gz). Override per-environment as needed.
hermanas.logs.directory = ./log

# Directory where resident (chicken) photos are stored as files outside the JAR.
hermanas.residents.photos-dir = ./residents-photos

# Multipart limits sized for resident photos (max 5 MB per file).
spring.servlet.multipart.max-file-size = 5MB
spring.servlet.multipart.max-request-size = 6MB

# Path to the users.properties file (bcrypt-hashed passwords).
# Keep this file OUTSIDE the JAR. Default: a file named users.properties next to the JAR.
# See README for the format and how to generate a hash with `java -jar hermanas.jar --hash`.
hermanas.security.users-file = ./users.properties

# Secret key used to sign "remember-me" tokens stored in the persistent_logins table.
# Change this on any installation; rotating it invalidates every existing remember-me cookie.
hermanas.security.remember-me-key = change-me-in-production-please
# Lifetime of the remember-me cookie, in seconds. Default: 31 days.
hermanas.security.remember-me-validity-seconds = 2678400

wifi.switch.enabled = true
consumption.mode.eco.force = false

# wifi.disabled.* are kept as a hidden safety knob. Do not surface them in the
# energy admin UI: cutting wifi makes the chicken coop unreachable, including
# the admin doing the cutting. Default: never cut.
wifi.disabled.eco = false
wifi.disabled.sunny = false
wifi.disabled.regular = false

cors.origins.allowed =

# Monthly mapping driving the automatic consumption mode (month → ECO|SUNNY|REGULAR).
# Used when consumption.mode.eco.force is false. Editable at runtime from the
# energy admin UI; these values are the seeds.
consumption.mode.month.1 = ECO
consumption.mode.month.2 = ECO
consumption.mode.month.3 = REGULAR
consumption.mode.month.4 = SUNNY
consumption.mode.month.5 = SUNNY
consumption.mode.month.6 = SUNNY
consumption.mode.month.7 = SUNNY
consumption.mode.month.8 = SUNNY
consumption.mode.month.9 = SUNNY
consumption.mode.month.10 = REGULAR
consumption.mode.month.11 = ECO
consumption.mode.month.12 = ECO

springdoc.swagger-ui.disable-swagger-default-url=true

# Logging levels. Spring Security is intentionally pinned to INFO: at DEBUG it floods
# the log with one block per HTTP request (FilterChainProxy / SecurityContext / RememberMe),
# which on the Pi Zero drowns the actual application events.
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.session=INFO
