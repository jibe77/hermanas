# Romanian message bundle, picked up by Spring's ResourceBundleMessageSource when a
# user's preferred language is "ro".

# restart incorrectly message
restarted.incorrectly.title=Hermanas a repornit incorect
restarted.incorrectly.message=Aplicația nu a fost disponibilă din cauza unei probleme tehnice.
restarted.incorrectly.message_with_picture=Vă rugăm să verificați ușa coteței pe imaginea de mai jos!
restarted.incorrectly.message_without_picture=Vă rugăm să verificați ușa coteței!\r\nImaginea din interiorul coteței nu este disponibilă (problemă cu camera ?).

# disk space problem message
diskspace.down.title=Hermanas : spațiu pe disc
diskspace.down.message=Atenție, spațiul pe disc este sub prag.

# door opening event
event.mail.opening.ok.title=Notif răsărit : ușa deschisă
event.mail.opening.ko.title=Notif răsărit : ușa nu s-a deschis corect
event.mail.opening.ok.message=Ușa a fost deschisă.
event.mail.opening.ko.message=Ușa nu s-a putut deschide corect.
