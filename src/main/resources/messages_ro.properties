event.mail.without_picture.message=Imaginea din interiorul coteței nu este disponibilă (problemă cu camera ?).

# registration emails — {0} = login, {1} = email
register.user.subject=Hermanas — confirmare înregistrare
register.user.body=<p>Bună {0},</p><p>Contul tău a fost creat pe Hermanas. În prezent este <strong>în așteptare de validare</strong> de către un administrator.</p><p>Vei primi un email de confirmare imediat ce contul tău va fi activat. Până atunci, nu te poți autentifica.</p><p>— Echipa Hermanas</p>
register.admin.subject=Hermanas — înregistrare nouă în așteptare : {0}
register.admin.body=<p>O nouă înregistrare așteaptă validare :</p><ul><li><strong>Login :</strong> {0}</li><li><strong>Email :</strong> {1}</li></ul><p>Conectează-te la ecranul <em>Users</em> pentru a promova acest cont la <code>USER</code> sau <code>ADMIN</code>, sau șterge-l dacă este nelegitim.</p>
