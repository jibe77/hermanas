# Romanian message bundle, picked up by Spring's ResourceBundleMessageSource when a
# user's preferred language is "ro".

# restart incorrectly message
# {0} gazdă, {1} detectat la, {2} ultima pornire, {3} durata indisponibilității
restarted.incorrectly.title=Hermanas : repornire neașteptată pe {0}
restarted.incorrectly.message=Aplicația a repornit neașteptat pe {0}.\r\n\r\nDetectat la                : {1}\r\nUltima pornire cunoscută   : {2}\r\nDurata indisponibilității  : {3}\r\n\r\n
restarted.incorrectly.message_with_picture=Vă rugăm să verificați ușa coteței pe imaginea de mai jos, apoi conectați-vă prin SSH la Pi pentru a consulta jurnalul de sistem (journalctl -u Hermanas, /var/log/syslog).
restarted.incorrectly.message_without_picture=Vă rugăm să verificați ușa coteței!\r\nImaginea din interiorul coteței nu este disponibilă (problemă cu camera ?). Conectați-vă prin SSH la Pi pentru investigare (journalctl -u Hermanas, /var/log/syslog).

# disk space problem message
# {0} gazdă, {1} cale, {2} liber MB, {3} total MB, {4} prag MB, {5} utilizare %, {6} dată
diskspace.down.title=Hermanas : spațiu pe disc redus pe {0}
diskspace.down.message=Atenție, spațiul pe disc al {0} este sub pragul de alertă.\r\n\r\nPunct de montare : {1}\r\nSpațiu liber     : {2} MB\r\nSpațiu total     : {3} MB\r\nPrag             : {4} MB\r\nUtilizare        : {5} %\r\nÎnregistrat la   : {6}\r\n\r\nEliberați spațiu pe Raspberry Pi (poze vechi, jurnale, evenimente) înainte ca discul să se umple — aplicația va începe să eșueze odată ce ultimul MB este consumat.

# door opening event
event.mail.opening.ok.title=Notif răsărit : ușa deschisă
event.mail.opening.ko.title=Notif răsărit : ușa nu s-a deschis corect
event.mail.opening.ok.message=Ușa a fost deschisă.
event.mail.opening.ko.message=Ușa nu s-a putut deschide corect.
event.mail.opening.closing.time=Ușa se va închide diseară la {0}.

# door closing event
event.mail.closing.ok.title=Notif apus : ușa închisă
event.mail.closing.ko.title=Notif apus : ușa nu s-a închis corect
event.mail.closing.ok.message=Ușa a fost închisă.
event.mail.closing.ko.message=Ușa nu s-a putut închide corect.
event.mail.closing.opening.time=Ușa se va deschide mâine dimineață la {0}.

# picture paragraph
event.mail.with_picture.message=Iată o imagine din interiorul coteței :
event.mail.with_pictures.message=Iată imaginile din interiorul coteței :
event.mail.without_picture.message=Imaginea din interiorul coteței nu este disponibilă (problemă cu camera ?).

# registration emails — {0} = login, {1} = email
register.user.subject=Hermanas — confirmare înregistrare
register.user.body=<p>Bună {0},</p><p>Contul tău a fost creat pe Hermanas. În prezent este <strong>în așteptare de validare</strong> de către un administrator.</p><p>Vei primi un email de confirmare imediat ce contul tău va fi activat. Până atunci, nu te poți autentifica.</p><p>— Echipa Hermanas</p>
register.admin.subject=Hermanas — înregistrare nouă în așteptare : {0}
register.admin.body=<p>O nouă înregistrare așteaptă validare :</p><ul><li><strong>Login :</strong> {0}</li><li><strong>Email :</strong> {1}</li></ul><p>Conectează-te la ecranul <em>Users</em> pentru a promova acest cont la <code>USER</code> sau <code>ADMIN</code>, sau șterge-l dacă este nelegitim.</p>
