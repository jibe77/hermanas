# French message bundle, picked up automatically by Spring's
# ResourceBundleMessageSource when a user's preferred language is "fr".
#
# The default (English) bundle is messages.properties; French overrides go here.
# IMPORTANT — Spring loads .properties files as ISO-8859-1 by default. Either keep
# accented characters Unicode-escaped, or set spring.messages.encoding=UTF-8 in
# application.properties (already the case in this project — see
# spring.messages.* properties).

# restart incorrectly message
restarted.incorrectly.title=Hermanas a redémarré de manière incorrecte
restarted.incorrectly.message=L'application n'a pas été disponible suite à un problème technique.
restarted.incorrectly.message_with_picture=Merci de vérifier la porte du poulailler sur l'image suivante !
restarted.incorrectly.message_without_picture=Merci de vérifier la porte du poulailler !\r\nL'image à l'intérieur du poulailler n'est pas disponible (problème de caméra ?).

# disk space problem message
diskspace.down.title=Hermanas : espace disque
diskspace.down.message=Attention, l'espace disque est en dessous du seuil.

# door opening event
event.mail.opening.ok.title=Notif lever du soleil : porte ouverte
event.mail.opening.ko.title=Notif lever du soleil : porte non ouverte correctement
event.mail.opening.ok.message=La porte a été ouverte.
event.mail.opening.ko.message=La porte n'a pas pu être ouverte correctement.
event.mail.opening.closing.time=La porte se fermera ce soir à {0}.

# door closing event
event.mail.closing.ok.title=Notif coucher du soleil : porte fermée
event.mail.closing.ko.title=Notif coucher du soleil : porte non fermée correctement
event.mail.closing.ok.message=La porte a été fermée.
event.mail.closing.ko.message=La porte n'a pas pu être fermée correctement.
event.mail.closing.opening.time=La porte s'ouvrira demain matin à {0}.

# picture paragraph
event.mail.with_picture.message=Voici une image prise à l'intérieur du poulailler :
event.mail.with_pictures.message=Voici les images prises à l'intérieur du poulailler :
event.mail.without_picture.message=L'image à l'intérieur du poulailler n'est pas disponible (problème de caméra ?).

# registration emails — {0} = login, {1} = email
register.user.subject=Hermanas — confirmation d'inscription
register.user.body=<p>Bonjour {0},</p><p>Votre compte a bien été créé sur Hermanas. Il est actuellement <strong>en attente de validation</strong> par un administrateur.</p><p>Vous recevrez une confirmation par email dès que votre compte sera activé. En attendant, vous ne pouvez pas encore vous connecter.</p><p>— L'équipe Hermanas</p>
register.admin.subject=Hermanas — nouvelle inscription en attente : {0}
register.admin.body=<p>Une nouvelle inscription est en attente de validation :</p><ul><li><strong>Login :</strong> {0}</li><li><strong>Email :</strong> {1}</li></ul><p>Connectez-vous à l'écran <em>Users</em> pour promouvoir ce compte en <code>USER</code> ou <code>ADMIN</code>, ou supprimez-le s'il est illégitime.</p>
