# French message bundle, picked up automatically by Spring's
# ResourceBundleMessageSource when a user's preferred language is "fr".
#
# The default (English) bundle is messages.properties; French overrides go here.
# IMPORTANT — Spring loads .properties files as ISO-8859-1 by default. Either keep
# accented characters Unicode-escaped, or set spring.messages.encoding=UTF-8 in
# application.properties (already the case in this project — see
# spring.messages.* properties).

# restart incorrectly message
# {0} hôte, {1} détecté à, {2} dernier démarrage, {3} durée d'indisponibilité
restarted.incorrectly.title=Hermanas : redémarrage inattendu sur {0}
restarted.incorrectly.message=L'application a redémarré de manière inattendue sur {0}.\r\n\r\nDétecté à            : {1}\r\nDernier démarrage     : {2}\r\nDurée d'indisponibilité : {3}\r\n\r\n
restarted.incorrectly.message_with_picture=Merci de vérifier la porte du poulailler sur l'image suivante, puis connectez-vous en SSH au Pi pour consulter le journal système (journalctl -u Hermanas, /var/log/syslog).
restarted.incorrectly.message_without_picture=Merci de vérifier la porte du poulailler !\r\nL'image à l'intérieur du poulailler n'est pas disponible (problème de caméra ?). Connectez-vous en SSH au Pi pour investiguer (journalctl -u Hermanas, /var/log/syslog).

# disk space problem message
# {0} hôte, {1} chemin, {2} libre Mo, {3} total Mo, {4} seuil Mo, {5} usage %, {6} horodatage
diskspace.down.title=Hermanas : espace disque faible sur {0}
diskspace.down.message=Attention, l'espace disque sur {0} est en dessous du seuil d'alerte.\r\n\r\nPoint de montage : {1}\r\nEspace libre     : {2} Mo\r\nEspace total     : {3} Mo\r\nSeuil            : {4} Mo\r\nUtilisation      : {5} %\r\nHorodatage       : {6}\r\n\r\nLibérez de l'espace sur le Raspberry Pi (anciennes photos, logs, journalisation) avant que le disque ne soit plein — l'application commencera à échouer dès que les derniers Mo seront consommés.

# door opening event
event.mail.opening.ok.title=Notif lever du soleil : porte ouverte
event.mail.opening.ko.title=Notif lever du soleil : porte non ouverte correctement
event.mail.opening.ok.message=La porte a été ouverte.
event.mail.opening.ko.message=La porte n'a pas pu être ouverte correctement.
event.mail.opening.closing.time=La porte se fermera ce soir à {0}.

# door closing event
event.mail.closing.ok.title=Notif coucher du soleil : porte fermée
event.mail.closing.ko.title=Notif coucher du soleil : porte non fermée correctement
event.mail.closing.ok.message=La porte a été fermée.
event.mail.closing.ko.message=La porte n'a pas pu être fermée correctement.
event.mail.closing.opening.time=La porte s'ouvrira demain matin à {0}.

# picture paragraph
event.mail.with_picture.message=Voici une image prise à l'intérieur du poulailler :
event.mail.with_pictures.message=Voici les images prises à l'intérieur du poulailler :
event.mail.without_picture.message=L'image à l'intérieur du poulailler n'est pas disponible (problème de caméra ?).

# vérification de l'état de la porte (déclenchée 30 minutes après le lever / coucher du soleil quand les interrupteurs de fin de course et l'analyse IA confirment tous les deux que la porte n'est pas dans l'état attendu).
event.mail.verification.morning.title=Hermanas : la porte n'est pas ouverte ce matin
event.mail.verification.morning.message=La vérification matinale de la porte a détecté que la porte du poulailler n'est PAS ouverte, alors qu'elle aurait dû s'ouvrir 30 minutes après le lever du soleil. La lecture des interrupteurs de fin de course était ambiguë et l'analyse IA a confirmé que la porte n'est pas dans l'état attendu.
event.mail.verification.evening.title=Hermanas : la porte n'est pas fermée ce soir
event.mail.verification.evening.message=La vérification du soir a détecté que la porte du poulailler n'est PAS fermée, alors qu'elle aurait dû se fermer 30 minutes après le coucher du soleil. La lecture des interrupteurs de fin de course était ambiguë et l'analyse IA a confirmé que la porte n'est pas dans l'état attendu.
event.mail.verification.ai.rationale=Justification de l'IA : {0}

# registration emails — {0} = login, {1} = email
register.user.subject=Hermanas — confirmation d'inscription
register.user.body=<p>Bonjour {0},</p><p>Votre compte a bien été créé sur Hermanas. Il est actuellement <strong>en attente de validation</strong> par un administrateur.</p><p>Vous recevrez une confirmation par email dès que votre compte sera activé. En attendant, vous ne pouvez pas encore vous connecter.</p><p>— L'équipe Hermanas</p>
register.admin.subject=Hermanas — nouvelle inscription en attente : {0}
register.admin.body=<p>Une nouvelle inscription est en attente de validation :</p><ul><li><strong>Login :</strong> {0}</li><li><strong>Email :</strong> {1}</li></ul><p>Connectez-vous à l'écran <em>Users</em> pour promouvoir ce compte en <code>USER</code> ou <code>ADMIN</code>, ou supprimez-le s'il est illégitime.</p>
