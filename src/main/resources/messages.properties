# registration emails — {0} = login, {1} = email
register.user.subject=Hermanas — account confirmation
register.user.body=<p>Hi {0},</p><p>Your account has been created on Hermanas. It is currently <strong>awaiting validation</strong> by an administrator.</p><p>You will receive a confirmation email as soon as your account is activated. In the meantime you cannot sign in.</p><p>— The Hermanas team</p>
register.admin.subject=Hermanas — new pending registration : {0}
register.admin.body=<p>A new registration is awaiting validation:</p><ul><li><strong>Login:</strong> {0}</li><li><strong>Email:</strong> {1}</li></ul><p>Sign in to the <em>Users</em> page to promote this account to <code>USER</code> or <code>ADMIN</code>, or delete it if it is illegitimate.</p>
