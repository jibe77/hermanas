# restart incorrectly message
# {0} host, {1} detected-at, {2} last-startup, {3} outage-duration
restarted.incorrectly.title=Hermanas : unexpected restart on {0}
restarted.incorrectly.message=The application restarted unexpectedly on {0}.\r\n\r\nDetected at      : {1}\r\nLast known start : {2}\r\nOutage duration  : {3}\r\n\r\n
restarted.incorrectly.message_with_picture=Please verify the chicken coop door on the following picture, then SSH into the Pi and check the system journal for clues (journalctl -u Hermanas, /var/log/syslog).
restarted.incorrectly.message_without_picture=Please verify the chicken coop door !\r\nThe picture inside the chicken coop is not available (camera problem ?). SSH into the Pi to investigate (journalctl -u Hermanas, /var/log/syslog).

# disk space problem message
# {0} host, {1} path, {2} free MB, {3} total MB, {4} threshold MB, {5} usage percent, {6} timestamp
diskspace.down.title=Hermanas : disk space low on {0}
diskspace.down.message=Warning, the disk space on {0} is below the alert threshold.\r\n\r\nMount point   : {1}\r\nFree space    : {2} MB\r\nTotal space   : {3} MB\r\nThreshold     : {4} MB\r\nUsage         : {5}%\r\nReported at   : {6}\r\n\r\nFree some space on the Raspberry Pi (old pictures, logs, journal entries) before the disk fills up — the application will start failing once the last MB is gone.

