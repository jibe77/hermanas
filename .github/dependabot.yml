version: 2
updates:
  # Backend — Spring Boot / Maven dependencies
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    # Spring Boot 2.x / Java 11 are pinned by Pi Zero hardware constraints —
    # ignore major upgrades that would force Spring Boot 3.x or Java 17+.
    # See CLAUDE.md "Phase 9 - Major Upgrade (BLOCKED - Hardware Constraint)".
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework.security:*"
        update-types: ["version-update:semver-major"]
      # Pi4J > 2.4.0 doesn't work on Pi Zero with Java 11
      - dependency-name: "com.pi4j:*"
      # Picam > 2.0.2 doesn't work on Pi Zero with Java 11
      - dependency-name: "uk.co.caprica:picam"

  # Frontend — Angular / npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    # Group all Angular packages into a single PR — they must move together.
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@angular-eslint/*"
    ignore:
      # Angular 19+ requires Node 20.19+ / TypeScript bumps — review manually.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]

  # CI workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
